<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111510"><title>Sezen Tekel | 3D Mağaza Tasarımı</title>
<style>
:root{--gold:#d8ad62;--panel:rgba(14,19,16,.92)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111510;color:#f6f2e8;font-family:system-ui,-apple-system,Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#111510;padding:24px;text-align:center}#loadbox{width:min(420px,92vw)}#bar{height:8px;background:#333b34;border-radius:20px;overflow:hidden;margin:18px 0 8px}#fill{height:100%;width:0;background:var(--gold);transition:width .12s}#pct{font-size:13px}#err{white-space:pre-wrap;color:#ffb7a7;font-size:12px;line-height:1.5;margin-top:12px;text-align:left}#hud{position:fixed;inset:0;pointer-events:none}.brand,.panel,.bottom,.controls,.hint{position:absolute;background:var(--panel);border:1px solid #ffffff22;box-shadow:0 8px 30px #0004;backdrop-filter:blur(10px);border-radius:12px}.brand{left:14px;top:14px;padding:12px 14px}.brand strong{letter-spacing:.15em;font-size:14px;display:block}.brand span{font-size:10px;color:#c5c9c1;letter-spacing:.12em}.panel{right:12px;top:12px;padding:10px;pointer-events:auto}.panel label{display:block;color:#e5c98f;font-size:10px;letter-spacing:.13em;margin:0 0 8px}.modes{display:flex;gap:5px}.modes button,.controls button{border:1px solid #ffffff20;border-radius:8px;background:#273029;color:#fff;padding:9px 10px;font-size:11px}.modes button.active{background:var(--gold);color:#161914;font-weight:800}.caption{font-size:10px;color:#c5c9c1;margin-top:7px}.bottom{left:14px;bottom:14px;padding:11px 13px;max-width:min(430px,calc(100vw - 28px))}.bottom strong{font-size:12px;letter-spacing:.08em}.bottom p{margin:5px 0 0;font-size:11px;color:#d0d2ca;line-height:1.4}.controls{right:12px;bottom:14px;padding:7px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:48%;pointer-events:auto}.controls button{background:#151b17}.hint{right:12px;bottom:78px;padding:8px 10px;font-size:10px;color:#e0e0d7;max-width:210px;text-align:right}@media(max-width:600px){.brand{left:8px;top:8px;padding:8px 10px}.brand strong{font-size:11px}.brand span{font-size:8px}.panel{top:62px;right:8px;padding:7px}.modes button{padding:8px 6px;font-size:9px}.caption{font-size:9px}.bottom{left:8px;bottom:8px;padding:8px 10px;max-width:55vw}.bottom p{font-size:10px}.controls{right:8px;bottom:8px;max-width:42%;padding:5px}.controls button{font-size:9px;padding:7px 6px}.hint{right:8px;bottom:80px;font-size:9px;max-width:42vw}}
</style></head><body>
<canvas id="view" aria-label="Sezen Tekel mağaza 3D görünümü"></canvas>
<div id="loading"><div id="loadbox"><div id="loadtitle">SEZEN TEKEL · TASARIM YÜKLENİYOR</div><div id="bar"><div id="fill"></div></div><div id="pct">0%</div><div id="err"></div></div></div>
<div id="hud"><div class="brand"><strong>SEZEN TEKEL</strong><span>3D MAĞAZA KONSEPTİ</span></div><div class="panel"><label>TASARIMI DEĞİŞTİR</label><div class="modes"><button class="active" data-mode="0">01 GOLD</button><button data-mode="1">02 URBAN</button><button data-mode="2">03 CLASSIC</button></div><div class="caption" id="caption">Sıcak ahşap · pirinç detay</div></div><div class="bottom"><strong id="title">01 / SEZEN SIGNATURE</strong><p id="desc">Tuborg ve Efes soğutucuları, Yeni Rakı rafı, sıcak ışıklar. Arka sol merdiven açık bırakıldı.</p></div><div class="hint" id="hint">Sürükle: etrafa bak · İki parmak/tekerlek: yaklaş-uzaklaş</div><div class="controls"><button id="home">⌂ Başlangıç</button><button id="spin">⟳ Döndür: Kapalı</button><button id="walk">↟ Gezin: Kapalı</button></div></div>
<script>
(function(){'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const loading=document.getElementById('loading'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),err=document.getElementById('err');
if(!ctx){document.getElementById('loadtitle').textContent='GÖRÜNTÜ AÇILAMADI';err.textContent='Tarayıcı 2D canvas desteği sunmuyor.';return;}
let W=0,H=0,dpr=1,mode=0,yaw=0,pitch=.08,camera={x:0,z:10},drag=false,lastX=0,lastY=0,auto=false,walk=false,keys={},last=0,frame=0;
const palettes=[{wall:'#252b26',wood:'#68452d',trim:'#d9ad61',floor:'#77766e',blue:'#1558c9',yellow:'#d7a900',light:'#ffce83'},{wall:'#252a31',wood:'#41413e',trim:'#218bd5',floor:'#686d72',blue:'#0879cb',yellow:'#d6ad13',light:'#8ed5ff'},{wall:'#29231e',wood:'#765033',trim:'#b78b55',floor:'#81796c',blue:'#1558c9',yellow:'#d7a900',light:'#ffddb0'}];
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function proj(x,y,z){let dx=x-camera.x,dz=z-camera.z,c=Math.cos(yaw),s=Math.sin(yaw);let xx=dx*c+dz*s,depth=-dx*s-dz*c;if(depth<.25)return null;let f=Math.min(W,H)*.9,yy=(y-1.45)*Math.cos(pitch)-depth*Math.sin(pitch);return{x:W/2+xx*f/depth,y:H*.52-yy*f/depth,scale:f/depth,depth}}
function polygon(pts,color,stroke){const q=pts.map(p=>proj(...p));if(q.some(p=>!p))return;ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function seg(a,b,color,width=1){let A=proj(...a),B=proj(...b);if(!A||!B)return;ctx.strokeStyle=color;ctx.lineWidth=Math.max(.5,width*(A.scale+B.scale)/22);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function box(x,y,z,w,h,d,color,edge){let x1=x-w/2,x2=x+w/2,z1=z-d/2,z2=z+d/2,y2=y+h;polygon([[x1,y,z1],[x2,y,z1],[x2,y2,z1],[x1,y2,z1]],color,edge);polygon([[x2,y,z1],[x2,y,z2],[x2,y2,z2],[x2,y2,z1]],shade(color,-25),edge);polygon([[x1,y2,z1],[x2,y2,z1],[x2,y2,z2],[x1,y2,z2]],shade(color,15),edge)}
function text3d(txt,x,y,z,color,size=20){let p=proj(x,y,z);if(!p)return;ctx.save();ctx.font='800 '+Math.max(8,Math.min(size*p.scale/6,30))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(txt,p.x,p.y);ctx.restore()}
function shelf(x,z,w=1.3,h=2.45){let P=palettes[mode];box(x,0,z,w,h,.45,P.wood,P.trim);for(let i=0;i<5;i++){let y=.3+i*.43;box(x,y,z+.25,w-.06,.045,.1,P.trim);for(let j=0;j<Math.floor(w/.17);j++){let bx=x-w/2+.11+j*.17,col=['#315b36','#8e532e','#b39a62','#243c69','#9e9a56'][(j+i*2)%5];box(bx,y+.06,z+.25,.085,.2,.075,col);box(bx,y+.25,z+.25,.035,.06,.035,col)}}}
function cooler(x,z,name,color){box(x,0,z,1.05,2.45,.65,'#101513',color);box(x,2.16,z+.34,.96,.28,.03,color,color);text3d(name,x,2.3,z+.37,'#fff',22);box(x,.35,z+.34,.9,1.55,.03,'#344047','#8ab2c3');for(let i=0;i<4;i++){box(x,.48+i*.36,z+.39,.84,.035,.06,'#c8d5d7');for(let j=0;j<5;j++)box(x-.32+j*.16,.56+i*.36,z+.4,.09,.19,.055,['#1d4caa','#e2e4df','#d5a526','#2c7a49'][j%4])}}
function scene(){let P=palettes[mode];ctx.fillStyle='#151a17';ctx.fillRect(0,0,W,H);polygon([[-4.7,0,-8.7],[4.7,0,-8.7],[4.7,0,8.5],[-4.7,0,8.5]],P.floor);for(let z=-8;z<=8;z+=1.2)seg([-4.7,.01,z],[4.7,.01,z],'#a6a395',.4);for(let x=-4.5;x<=4.5;x+=1.1)seg([x,.01,-8.7],[x,.01,8.5],'#a6a395',.4);
polygon([[-4.7,0,-8.7],[-4.7,3.8,-8.7],[-4.7,3.8,8.5],[-4.7,0,8.5]],P.wall);polygon([[4.7,0,-8.7],[4.7,3.8,-8.7],[4.7,3.8,8.5],[4.7,0,8.5]],P.wall);polygon([[-4.7,0,-8.7],[-4.7,3.8,-8.7],[4.7,3.8,-8.7],[4.7,0,-8.7]],shade(P.wall,8));
for(let x=-.8;x<4.2;x+=1.35)shelf(x,-8.05,1.15,2.5);text3d('SEZEN TEKEL',1,3.15,-7.95,'#f4d99f',34);
// rear-left staircase stays open
for(let i=0;i<8;i++)box(-3.45,.1+i*.17,-7.4+i*.38,1.45,.2,.42,'#555b56',P.trim);text3d('ÜST KAT',-3.45,1.9,-4.9,'#f1eee3',15);
cooler(-4.05,5.3,'EFES',P.blue);cooler(-4.05,2.4,'TUBORG',P.yellow);shelf(-4.05,-.5,1.0,2.25);shelf(-4.05,-3.25,1,2.4);
cooler(4.05,5.3,'EFES',P.blue);cooler(4.05,2.4,'TUBORG',P.yellow);cooler(4.05,-.5,'EFES',P.blue);shelf(4.05,-3.25,1,2.4);
shelf(-1.65,-4.8,1.15,2.25);text3d('YENI RAKI',-1.65,2.42,-4.55,'#fff',16);text3d('VISKI · VOTKA · CIN',1.5,2.9,-7.8,'#f4d99f',14);
box(0,.04,-1.25,1.25,.92,.95,P.wood,P.trim);for(let i=0;i<3;i++)for(let j=0;j<3;j++)box(-.4+i*.4,.98,-1.55+j*.28,.12,.35,.12,['#3b693d','#74442a','#b2a06b'][i%3]);
box(2.55,.04,-4.8,1.65,1.1,.78,P.wood,P.trim);text3d('KASA',2.55,.72,-4.38,'#f4d99f',20);
for(let x of [-2.7,0,2.7])for(let z of [-5,0,5])box(x,3.65,z,.72,.025,.28,'#fff0cf',P.light);
}
function tick(t){if(auto)yaw+=.003;if(walk){let f=(keys.ArrowUp||keys.w?1:0)-(keys.ArrowDown||keys.s?1:0),side=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);camera.x+=Math.sin(yaw)*f*.07+Math.cos(yaw)*side*.07;camera.z-=Math.cos(yaw)*f*.07-Math.sin(yaw)*side*.07;camera.x=Math.max(-3.1,Math.min(3.1,camera.x));camera.z=Math.max(-7.8,Math.min(8,camera.z))}scene();frame=requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.006;pitch=Math.max(-.35,Math.min(.45,pitch+(e.clientY-lastY)*.002));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('wheel',e=>{e.preventDefault();camera.z=Math.max(3,Math.min(15,camera.z+Math.sign(e.deltaY)*.55))},{passive:false});let touchDistance=0;
window.addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('active',q===b));document.getElementById('caption').textContent=['Sıcak ahşap · pirinç detay','Antrasit · mavi ışık','Klasik koyu ahşap'][mode];document.getElementById('title').textContent=['01 / SEZEN SIGNATURE','02 / SEZEN URBAN','03 / SEZEN CLASSIC'][mode]}));
document.getElementById('home').onclick=()=>{yaw=0;pitch=.08;camera={x:0,z:10}};document.getElementById('spin').onclick=e=>{auto=!auto;e.currentTarget.textContent='⟳ Döndür: '+(auto?'Açık':'Kapalı')};document.getElementById('walk').onclick=e=>{walk=!walk;e.currentTarget.textContent='↟ Gezin: '+(walk?'Açık':'Kapalı');document.getElementById('hint').textContent=walk?'WASD / ok tuşlarıyla yürü · sürükleyerek bak':'Sürükle: etrafa bak · tekerlek: yaklaş-uzaklaş'};
function fail(e){cancelAnimationFrame(frame);document.getElementById('loadtitle').textContent='TASARIM AÇILAMADI';fill.style.width='100%';pct.textContent='HATA';err.textContent=(e&&e.stack)||String(e);loading.style.display='flex'}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
try{fill.style.width='25%';pct.textContent='25%';scene();fill.style.width='70%';pct.textContent='70%';frame=requestAnimationFrame(tick);fill.style.width='100%';pct.textContent='100%';setTimeout(()=>{loading.style.opacity='0';setTimeout(()=>loading.remove(),300)},350)}catch(e){fail(e)}
})();
</script></body></html>
